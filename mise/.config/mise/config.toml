# Global mise configuration: tool versions, env vars and tasks.
# https://mise.jdx.dev/configuration.html
#
# Per-project versions come from each repo's mise.toml, or from idiomatic
# version files (see settings below) for repos that do not use mise yet.

[tools]
# Ships bin/python next to bin/python3, so no `python` shim formula is needed.
# Project virtualenvs still come from uv.
# keep-sorted start
go = "1.27"
node = "26.7"
python = "3.14"
ruby = "3.4"
rust = "1.97"
terraform = "1.15"
terraform-docs = "0.24.0"
# keep-sorted end

[env]
# Go CLI binaries installed with `go install`.
_.path = "{{env.HOME}}/go/bin"
# keep-sorted start
GOPATH = "{{env.HOME}}/go"
# https://stackoverflow.com/questions/46288847/how-to-suppress-pip-upgrade-warning
PIP_DISABLE_PIP_VERSION_CHECK = "1"
# keep-sorted end

[settings]
# Honour .go-version, .python-version, .ruby-version, rust-toolchain.toml
# and .terraform-version in repos without mise.toml.
idiomatic_version_file_enable_tools = [
  # keep-sorted start
  "go",
  "node",
  "python",
  "ruby",
  "rust",
  "terraform",
  # keep-sorted end
]

# vim: ft=toml
